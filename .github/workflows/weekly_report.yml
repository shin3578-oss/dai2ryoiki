# ==========================================================
# 【何をする】①第2領域のサイトのこの1週間のアクセスをGA4から取り、院長DMへ1通送る
#           （直近7日＋前の週との比較＋検索での見え方＋公開からの累計）
#           ②ブログを週1本のペースで出すため、ネタ帳 topics.json の次の1本を院長DMへ知らせる
# 【いつ動く】月曜 5:30（apotoolの morning_assistant.yml から連鎖dispatch・月曜だけ発火）＋手動実行
#            2026-09-21に月曜21:00から朝へ移設（院長指示「タイミング、朝にしてくれない？」。
#            夜に次の題が届いても記事を書けないため）
# 【通知先】レポートBot 12786828（apotool の lw_notify.yml を呼び出す）
# 【費用】このリポジトリは公開なのでActionsの実行時間は無料枠を消費しない
# 【経緯】2026-08-18は毎晩の配信だったが、訪問者0が続き毎晩同じ文面になるため
#         2026-08-24に週1へ変更。人が来はじめたら毎晩に戻す
# ==========================================================
name: 第2領域 ウィークリーレポート

on:
  workflow_dispatch:
    inputs:
      no_notify:
        description: "LINEワークスへ送らない（動作確認用。文面はログにだけ出る）"
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: レポートを作って送る
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          NOTIFY_PAT: ${{ secrets.NOTIFY_PAT }}
          NO_NOTIFY: ${{ inputs.no_notify }}
        run: python report.py

      - name: 次に出すブログの題を知らせる
        # 記事づくり自体はClaude Codeとのセッションで行う。ここは「今週の題はこれ」を出すだけ。
        # 数秒で終わるのでジョブは分けない（GitHub Actionsはジョブ単位で1分に切り上げ課金されるため）。
        if: always()
        env:
          NOTIFY_PAT: ${{ secrets.NOTIFY_PAT }}
          NO_NOTIFY: ${{ inputs.no_notify }}
        run: python next_topic.py
